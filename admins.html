<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Admin | Kreation Digital Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #003333; --secondary: #39FF14; --accent: #00CC99;
    --dark: #000000; --light: #FFFFFF; --gray: #AAAAAA;
    --danger: #ff3b30; --warning: #ff9500; --success: #4CAF50; --info: #5ac8fa;
    --pink: #ff4d6d;
    --card-bg: rgba(0, 51, 51, 0.3);
    --neon-glow: 0 0 10px rgba(57,255,20,0.7), 0 0 20px rgba(57,255,20,0.5), 0 0 30px rgba(57,255,20,0.3);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--dark); color: var(--light);
    min-height: 100vh; overflow: hidden;
  }

  #particles-js { position: fixed; inset: 0; z-index: -2; opacity: 0.3; }
  .gradient-bg {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #001a1a 0%, #000000 50%, #004d4d 100%);
    z-index: -3;
  }

  /* ---------- LOGIN ---------- */
  .login-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 2000;
  }
  .login-box {
    background: var(--card-bg); padding: 3rem; border-radius: 20px;
    width: 90%; max-width: 450px; border: 1px solid var(--secondary);
    box-shadow: var(--neon-glow); position: relative; overflow: hidden;
  }
  .login-box::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
    background: linear-gradient(90deg, var(--secondary), var(--accent));
  }
  .login-box h2 { color: var(--light); margin-bottom: 0.5rem; font-size: 2rem; text-align: center; }
  .login-box h2 span { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }
  .login-box p { color: var(--gray); text-align: center; margin-bottom: 2rem; }
  .login-input {
    width: 100%; padding: 1rem; margin-bottom: 1rem;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(57,255,20,0.3);
    border-radius: 10px; color: var(--light); font-size: 1rem;
  }
  .login-input:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 10px rgba(57,255,20,0.3); }
  .login-btn {
    width: 100%; padding: 1rem;
    background: linear-gradient(135deg, var(--secondary), var(--accent));
    border: none; border-radius: 10px; color: var(--dark);
    font-weight: 700; cursor: pointer; font-size: 1.1rem; transition: all 0.3s;
  }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(57,255,20,0.4); }
  .login-error { color: var(--danger); margin-top: 1rem; text-align: center; font-size: 0.9rem; }

  /* ---------- DASHBOARD ---------- */
  #dashboard { display: none; height: 100vh; width: 100vw; overflow: hidden; }
  .admin-layout { display: flex; height: 100vh; width: 100vw; position: relative; z-index: 1; }

  .sidebar {
    width: 390px; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    border-right: 1px solid rgba(57,255,20,0.2);
    display: flex; flex-direction: column; position: relative;
  }
  .sidebar::before {
    content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%;
    background: linear-gradient(180deg, var(--secondary), var(--accent));
  }
  .sidebar-header { padding: 1.3rem 1.5rem 0.8rem; border-bottom: 1px solid rgba(57,255,20,0.2); }
  .admin-logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.4rem; font-weight: 800; margin-bottom: 1.2rem; }
  .admin-logo i { color: var(--secondary); font-size: 2rem; }
  .admin-logo span { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1.2rem; }
  .stat-card {
    background: rgba(57,255,20,0.05); border: 1px solid rgba(57,255,20,0.2);
    border-radius: 10px; padding: 0.7rem 0.3rem; text-align: center; transition: all 0.3s;
  }
  .stat-card:hover { border-color: var(--secondary); box-shadow: 0 0 15px rgba(57,255,20,0.2); }
  .stat-icon { color: var(--secondary); font-size: 1rem; margin-bottom: 0.2rem; }
  .stat-value { font-size: 1.3rem; font-weight: 700; color: var(--secondary); line-height: 1.2; }
  .stat-label { font-size: 0.58rem; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; }

  .tab-nav { display: flex; gap: 0.4rem; }
  .tab-btn {
    flex: 1; padding: 0.75rem 0.3rem; background: rgba(0,0,0,0.3);
    border: 1px solid rgba(57,255,20,0.2); color: var(--gray);
    border-radius: 8px; cursor: pointer; transition: all 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    font-size: 0.82rem; font-family: inherit;
  }
  .tab-btn:hover { border-color: var(--secondary); color: var(--light); }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--secondary), var(--accent));
    color: var(--dark); border-color: transparent; font-weight: 600;
  }

  .filter-tabs { display: flex; gap: 0.5rem; padding: 0.8rem 1.5rem 0; }
  .filter-btn {
    flex: 1; padding: 0.5rem; background: rgba(0,0,0,0.3);
    border: 1px solid rgba(57,255,20,0.2); color: var(--gray);
    border-radius: 6px; cursor: pointer; transition: all 0.3s; font-size: 0.78rem;
    font-family: inherit;
  }
  .filter-btn:hover { border-color: var(--secondary); color: var(--light); }
  .filter-btn.active { background: rgba(57,255,20,0.2); color: var(--secondary); border-color: var(--secondary); }

  .search-box { padding: 1rem 1.5rem 0.8rem; }
  .search-input {
    width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.3);
    border: 1px solid rgba(57,255,20,0.2); border-radius: 8px;
    color: var(--light); font-size: 0.95rem;
  }
  .search-input:focus { outline: none; border-color: var(--secondary); }

  .items-list { flex: 1; overflow-y: auto; padding: 0 1.5rem 1.5rem; }

  .item-card {
    background: rgba(0,0,0,0.3); border: 1px solid rgba(57,255,20,0.1);
    border-radius: 10px; padding: 1rem; margin-bottom: 0.8rem;
    cursor: pointer; transition: all 0.3s; position: relative;
  }
  .item-card:hover {
    border-color: var(--secondary); transform: translateX(5px);
    background: rgba(57,255,20,0.05);
  }
  .item-card.active {
    border-color: var(--secondary); background: rgba(57,255,20,0.1);
    box-shadow: 0 0 20px rgba(57,255,20,0.2);
  }
  .item-card.pending { border-left: 4px solid var(--warning); }
  .item-card.unread { border-left: 4px solid var(--info); }
  .item-card.draft { border-left: 4px solid var(--gray); }

  .item-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 0.5rem; margin-bottom: 0.5rem;
  }
  .item-title { font-weight: 600; color: var(--light); font-size: 1rem; line-height: 1.35; }
  .item-badge {
    background: var(--warning); color: var(--dark); font-size: 0.66rem;
    font-weight: bold; padding: 0.2rem 0.6rem; border-radius: 12px;
    white-space: nowrap; flex-shrink: 0;
  }
  .item-badge.approved { background: var(--success); }
  .item-badge.unread { background: var(--info); color: var(--dark); }
  .item-badge.published { background: var(--success); color: var(--dark); }
  .item-badge.draft-badge { background: var(--gray); color: var(--dark); }

  .item-rating { color: gold; margin-bottom: 0.3rem; font-size: 0.8rem; }
  .item-preview { font-size: 0.8rem; color: rgba(255,255,255,0.7); margin-bottom: 0.4rem; }
  .item-meta {
    display: flex; justify-content: space-between; gap: 0.5rem;
    font-size: 0.65rem; color: var(--gray);
  }
  .item-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }
  .service-tag {
    background: rgba(57,255,20,0.1); color: var(--secondary);
    padding: 0.2rem 0.5rem; border-radius: 10px; font-size: 0.62rem;
  }

  /* ---------- MAIN CONTENT ---------- */
  .main-content {
    flex: 1; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .main-content::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
    background: linear-gradient(90deg, var(--secondary), var(--accent)); z-index: 5;
  }

  .content-header {
    padding: 1.3rem 2rem; background: rgba(0,0,0,0.4);
    border-bottom: 1px solid rgba(57,255,20,0.2);
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 10;
  }
  .header-info h2 { font-size: 1.35rem; margin-bottom: 0.25rem; }
  .header-info p { color: var(--gray); font-size: 0.85rem; }
  .header-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

  .logout-btn {
    background: rgba(255,59,48,0.1); border: 1px solid var(--danger);
    color: var(--danger); padding: 0.5rem 1.2rem; border-radius: 30px;
    cursor: pointer; transition: all 0.3s; font-family: inherit; font-size: 0.85rem;
  }
  .logout-btn:hover { background: var(--danger); color: white; }

  .content-body { flex: 1; padding: 2rem; overflow-y: auto; }

  /* ---------- BUTTONS ---------- */
  .btn {
    padding: 0.65rem 1.4rem; border: none; border-radius: 30px;
    font-weight: 600; cursor: pointer; transition: all 0.3s;
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: inherit; font-size: 0.88rem; white-space: nowrap;
  }
  .btn-primary { background: linear-gradient(135deg, var(--secondary), var(--accent)); color: var(--dark); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(57,255,20,0.4); }
  .btn-danger { background: rgba(255,59,48,0.1); border: 1px solid var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-warning { background: rgba(255,149,0,0.1); border: 1px solid var(--warning); color: var(--warning); }
  .btn-warning:hover { background: var(--warning); color: white; }
  .btn-success { background: rgba(76,175,80,0.1); border: 1px solid var(--success); color: var(--success); }
  .btn-success:hover { background: var(--success); color: white; }
  .btn-info { background: rgba(90,200,250,0.1); border: 1px solid var(--info); color: var(--info); }
  .btn-info:hover { background: var(--info); color: white; }
  .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(57,255,20,0.3); color: var(--light); }
  .btn-ghost:hover { border-color: var(--secondary); color: var(--secondary); }

  /* ---------- WELCOME ---------- */
  .welcome-screen {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 2rem;
  }
  .welcome-icon {
    font-size: 5rem; color: var(--secondary); margin-bottom: 2rem;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  .welcome-screen h2 { font-size: 2.3rem; margin-bottom: 1rem; }
  .welcome-screen h2 span { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }
  .welcome-screen p { color: var(--gray); font-size: 1rem; max-width: 500px; }

  /* ---------- BLOG EDITOR ---------- */
  .blog-editor { max-width: 1000px; margin: 0 auto; }
  .editor-grid { display: grid; grid-template-columns: 1fr 340px; gap: 1.8rem; }
  .editor-main, .editor-side {
    background: rgba(0,0,0,0.35); border: 1px solid rgba(57,255,20,0.2);
    border-radius: 14px; padding: 1.6rem;
  }
  .field { margin-bottom: 1.2rem; }
  .field label {
    display: block; margin-bottom: 0.5rem; font-size: 0.78rem;
    color: var(--gray); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600;
  }
  .field input, .field textarea, .field select {
    width: 100%; padding: 0.8rem 1rem;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(57,255,20,0.25);
    border-radius: 9px; color: var(--light); font-family: inherit; font-size: 0.92rem;
    transition: all 0.3s;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--secondary);
    box-shadow: 0 0 12px rgba(57,255,20,0.15);
  }
  .field textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
  .field .hint { font-size: 0.7rem; color: var(--gray); margin-top: 0.35rem; opacity: 0.8; }
  .field .hint code { background: rgba(0,0,0,0.6); color: var(--secondary); padding: 0.1rem 0.35rem; border-radius: 4px; }

  #postContent { min-height: 380px; font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; font-size: 0.9rem; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 0; border-top: 1px solid rgba(57,255,20,0.15);
    border-bottom: 1px solid rgba(57,255,20,0.15);
    margin-bottom: 1.2rem;
  }
  .toggle-row span { font-size: 0.9rem; }
  .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: rgba(255,255,255,0.15); transition: 0.3s; border-radius: 26px;
  }
  .slider:before {
    content: ''; position: absolute; height: 20px; width: 20px;
    left: 3px; bottom: 3px; background: white; transition: 0.3s; border-radius: 50%;
  }
  .switch input:checked + .slider { background: var(--secondary); }
  .switch input:checked + .slider:before { transform: translateX(22px); }

  .editor-actions {
    display: flex; gap: 0.7rem; flex-wrap: wrap;
    padding-top: 1.2rem; border-top: 1px solid rgba(57,255,20,0.15);
  }

  .cover-preview {
    width: 100%; height: 160px; object-fit: cover; border-radius: 10px;
    margin-top: 0.6rem; border: 1px solid rgba(57,255,20,0.25); display: none;
  }

  /* ---------- ENGAGEMENT PANEL ---------- */
  .engagement-panel {
    margin-top: 2rem; background: rgba(0,0,0,0.35);
    border: 1px solid rgba(57,255,20,0.2); border-radius: 14px; padding: 1.6rem;
  }
  .engagement-stats {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 1rem; margin-bottom: 1.4rem;
    padding-bottom: 1.2rem; border-bottom: 1px solid rgba(57,255,20,0.15);
  }
  .engagement-stat-block { text-align: center; flex: 1; min-width: 120px; }
  .engagement-stat-label {
    font-size: 0.72rem; color: var(--gray); text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 0.3rem;
  }
  .engagement-stat-value { font-size: 2.2rem; font-weight: 800; line-height: 1.1; }
  .engagement-stat-value.likes { color: var(--pink); }
  .engagement-stat-value.comments { color: var(--secondary); }

  .comments-admin-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .admin-comment {
    background: rgba(0,51,51,0.4); border: 1px solid rgba(57,255,20,0.15);
    border-left: 3px solid var(--secondary); border-radius: 8px; padding: 1rem 1.2rem;
  }
  .admin-comment-head {
    display: flex; justify-content: space-between; gap: 1rem;
    margin-bottom: 0.4rem; flex-wrap: wrap;
  }
  .admin-comment-name { color: var(--light); font-weight: 700; font-size: 0.95rem; }
  .admin-comment-email { color: var(--gray); font-size: 0.8rem; margin-left: 0.5rem; }
  .admin-comment-date { color: var(--gray); font-size: 0.75rem; }
  .admin-comment-text {
    color: rgba(255,255,255,0.88); font-size: 0.9rem; line-height: 1.55;
    white-space: pre-wrap; margin-bottom: 0.7rem; word-break: break-word;
  }

  /* ---------- REVIEW / CHAT DETAIL ---------- */
  .review-detail, .chat-detail { max-width: 900px; margin: 0 auto; }
  .detail-message {
    background: rgba(0,0,0,0.3); border: 1px solid rgba(57,255,20,0.2);
    border-radius: 12px; padding: 1.8rem; margin: 1.4rem 0;
    font-size: 1rem; line-height: 1.65; border-left: 4px solid var(--secondary);
  }
  .detail-services { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
  .detail-service {
    background: rgba(57,255,20,0.1); border: 1px solid rgba(57,255,20,0.3);
    color: var(--secondary); padding: 0.4rem 1rem; border-radius: 30px; font-size: 0.82rem;
  }
  .detail-meta {
    display: flex; gap: 2rem; color: var(--gray); font-size: 0.88rem;
    margin: 1rem 0; flex-wrap: wrap;
  }
  .detail-meta i { color: var(--secondary); margin-right: 0.35rem; }

  .messages-container {
    display: flex; flex-direction: column; gap: 1rem;
    padding: 1rem 0; max-height: 55vh; overflow-y: auto;
  }
  .message {
    max-width: 80%; padding: 1rem 1.2rem; border-radius: 15px; position: relative;
  }
  .message.client {
    align-self: flex-start; background: rgba(57,255,20,0.1);
    border: 1px solid rgba(57,255,20,0.2); border-bottom-left-radius: 5px;
  }
  .message.admin {
    align-self: flex-end; background: linear-gradient(135deg, var(--secondary), var(--accent));
    color: var(--dark); border-bottom-right-radius: 5px;
  }
  .message-content { font-size: 0.95rem; line-height: 1.5; margin-bottom: 0.3rem; word-wrap: break-word; }
  .message-meta {
    display: flex; justify-content: flex-end; gap: 0.5rem; font-size: 0.65rem; opacity: 0.7;
  }
  .message.client .message-meta { color: var(--gray); }
  .message.admin .message-meta { color: rgba(0,0,0,0.7); }

  .input-area {
    padding: 1.2rem 2rem; background: rgba(0,0,0,0.4);
    border-top: 1px solid rgba(57,255,20,0.2);
  }
  .message-form { display: flex; gap: 1rem; align-items: flex-end; }
  .message-input {
    flex: 1; padding: 1rem; background: rgba(0,0,0,0.5);
    border: 1px solid rgba(57,255,20,0.3); border-radius: 10px;
    color: var(--light); resize: none; min-height: 50px; max-height: 150px;
    font-size: 0.95rem; font-family: inherit;
  }
  .message-input:focus { outline: none; border-color: var(--secondary); }
  .send-btn {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, var(--secondary), var(--accent));
    border: none; color: var(--dark); cursor: pointer; transition: all 0.3s; font-size: 1.05rem;
  }
  .send-btn:hover { transform: scale(1.08); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .action-buttons { display: flex; gap: 1rem; margin: 1.6rem 0; flex-wrap: wrap; }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    backdrop-filter: blur(8px); z-index: 3000;
    display: flex; align-items: center; justify-content: center; padding: 2rem;
  }
  .modal-box {
    background: #0a0a0a; border: 1px solid var(--secondary);
    border-radius: 16px; max-width: 860px; width: 100%; max-height: 88vh;
    display: flex; flex-direction: column; box-shadow: var(--neon-glow);
  }
  .modal-header {
    padding: 1.2rem 1.6rem; border-bottom: 1px solid rgba(57,255,20,0.2);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h3 { font-size: 1.15rem; }
  .modal-close {
    background: none; border: none; color: var(--gray);
    font-size: 1.4rem; cursor: pointer; transition: color 0.3s;
  }
  .modal-close:hover { color: var(--danger); }
  .modal-body { padding: 1.6rem; overflow-y: auto; }
  .preview-content { font-size: 1rem; line-height: 1.85; color: rgba(255,255,255,0.9); }
  .preview-content h2 { font-size: 1.6rem; color: var(--light); margin: 1.8rem 0 0.8rem; padding-left: 1rem; border-left: 4px solid var(--secondary); }
  .preview-content h3 { font-size: 1.25rem; color: var(--secondary); margin: 1.5rem 0 0.6rem; }
  .preview-content p { margin-bottom: 1.2rem; }
  .preview-content ul, .preview-content ol { margin: 0 0 1.2rem 1.5rem; }
  .preview-content li { margin-bottom: 0.5rem; }
  .preview-content blockquote {
    border-left: 4px solid var(--secondary); background: rgba(57,255,20,0.05);
    padding: 1rem 1.4rem; margin: 0 0 1.2rem; font-style: italic; border-radius: 0 10px 10px 0;
  }
  .preview-content code { background: rgba(0,0,0,0.6); color: var(--secondary); padding: 0.15rem 0.45rem; border-radius: 5px; }
  .preview-content a { color: var(--secondary); }
  .preview-content img { max-width: 100%; border-radius: 12px; margin: 1rem 0; }
  .preview-content strong { color: var(--light); }

  /* ---------- MISC ---------- */
  .loading-spinner { text-align: center; padding: 3rem; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid rgba(57,255,20,0.3);
    border-top-color: var(--secondary); border-radius: 50%;
    animation: spin 1s infinite linear; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-msg { text-align: center; color: var(--gray); padding: 2.5rem 1.5rem; }
  .empty-msg i { font-size: 2.5rem; opacity: 0.3; display: block; margin-bottom: 0.8rem; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
  ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 3px; }

  @media (max-width: 960px) {
    .admin-layout { flex-direction: column; }
    .sidebar { width: 100%; height: 42vh; }
    .main-content { height: 58vh; }
    .editor-grid { grid-template-columns: 1fr; }
    .message { max-width: 90%; }
    .content-body { padding: 1.2rem; }
    .content-header { padding: 1rem 1.2rem; }
  }
</style>
</head>
<body>
  <div id="particles-js"></div>
  <div class="gradient-bg"></div>

  <!-- LOGIN -->
  <div id="loginModal" class="login-modal">
    <div class="login-box">
      <h2><span>Kreation</span> Admin</h2>
      <p>Enter your credentials to access the dashboard</p>
      <input type="email" id="loginEmail" class="login-input" placeholder="admin@kreationdigitals.com" value="admin@kreationdigitals.com">
      <input type="password" id="loginPassword" class="login-input" placeholder="Password" value="123456">
      <button class="login-btn" onclick="handleLogin()">
        <i class="fas fa-lock-open"></i> Access Dashboard
      </button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="admin-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="admin-logo"><i class="fas fa-robot"></i> Kreation <span>Hub</span></div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon"><i class="fas fa-star"></i></div>
              <div class="stat-value" id="statReviews">0</div>
              <div class="stat-label">Reviews</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon"><i class="fas fa-comments"></i></div>
              <div class="stat-value" id="statChats">0</div>
              <div class="stat-label">Chats</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon"><i class="fas fa-newspaper"></i></div>
              <div class="stat-value" id="statPosts">0</div>
              <div class="stat-label">Posts</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
              <div class="stat-value" id="statDrafts">0</div>
              <div class="stat-label">Drafts</div>
            </div>
          </div>

          <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('reviews')" id="tabReviews">
              <i class="fas fa-star"></i> Reviews
            </button>
            <button class="tab-btn" onclick="switchTab('chats')" id="tabChats">
              <i class="fas fa-comments"></i> Chats
            </button>
            <button class="tab-btn" onclick="switchTab('blog')" id="tabBlog">
              <i class="fas fa-newspaper"></i> Blog
            </button>
          </div>
        </div>

        <div id="reviewsFilter" class="filter-tabs">
          <button class="filter-btn active" onclick="filterReviews('all')">All</button>
          <button class="filter-btn" onclick="filterReviews('pending')">Pending</button>
          <button class="filter-btn" onclick="filterReviews('approved')">Approved</button>
        </div>

        <div id="chatsFilter" class="filter-tabs" style="display:none;">
          <button class="filter-btn active" onclick="filterChats('all')">All</button>
          <button class="filter-btn" onclick="filterChats('unread')">Unread</button>
          <button class="filter-btn" onclick="filterChats('replied')">Replied</button>
        </div>

        <div id="blogFilter" class="filter-tabs" style="display:none;">
          <button class="filter-btn active" onclick="filterPosts('all')">All</button>
          <button class="filter-btn" onclick="filterPosts('published')">Published</button>
          <button class="filter-btn" onclick="filterPosts('draft')">Drafts</button>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search...">
        </div>

        <div class="items-list" id="itemsList">
          <div class="loading-spinner"><div class="spinner"></div><p>Loading...</p></div>
        </div>
      </aside>

      <main class="main-content">
        <div class="content-header">
          <div class="header-info" id="headerInfo">
            <h2>Welcome, Admin</h2>
            <p>Select an item from the sidebar to manage</p>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary" id="newPostBtn" style="display:none;" onclick="newPost()">
              <i class="fas fa-plus"></i> New Post
            </button>
            <button class="logout-btn" onclick="handleLogout()">
              <i class="fas fa-sign-out-alt"></i> Logout
            </button>
          </div>
        </div>

        <div class="content-body" id="contentBody">
          <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon"><i class="fas fa-crown"></i></div>
            <h2>Welcome <span>Admin</span></h2>
            <p>Manage reviews, chats, and blog posts from one unified dashboard.</p>
          </div>
          <div id="dynamicContent" style="display:none;"></div>
        </div>

        <div id="chatInputArea" class="input-area" style="display:none;">
          <form id="adminMessageForm" class="message-form">
            <textarea id="adminMessageInput" class="message-input" placeholder="Type your reply... (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
            <button type="submit" class="send-btn" id="sendMessageBtn">
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <script>
    /* ============================================================
       FIREBASE
    ============================================================ */
    const firebaseConfig = {
      apiKey: "AIzaSyDLrhVKnl60WcRYkpFEvDvy3-u5_WX-rCo",
      authDomain: "reviews-d3d7a.firebaseapp.com",
      projectId: "reviews-d3d7a",
      storageBucket: "reviews-d3d7a.firebasestorage.app",
      messagingSenderId: "743750078637",
      appId: "1:743750078637:web:1ce08d557c5c6080967624"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    /* ============================================================
       STATE
    ============================================================ */
    let currentAdmin = null;
    let currentTab = 'reviews';
    let currentFilter = 'all';
    let searchTerm = '';
    let allReviews = [];
    let allChats = [];
    let allPosts = [];
    let currentReviewId = null;
    let currentChatId = null;
    let currentPostId = null;
    let currentMessages = [];
    let messageListener = null;

    /* ============================================================
       PARTICLES
    ============================================================ */
    particlesJS('particles-js', {
      particles: {
        number: { value: 50 },
        color: { value: "#39FF14" },
        shape: { type: "polygon" },
        opacity: { value: 0.2 },
        size: { value: 3 },
        line_linked: { enable: true, distance: 150, color: "#39FF14", opacity: 0.2 }
      }
    });

    /* ============================================================
       AUTH
    ============================================================ */
    auth.onAuthStateChanged(user => {
      if (user) {
        currentAdmin = user;
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadAllData();
      } else {
        currentAdmin = null;
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    window.handleLogin = async function () {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        errorEl.textContent = 'Login failed: ' + err.message;
      }
    };

    window.handleLogout = function () {
      auth.signOut();
    };

    /* ============================================================
       LOAD DATA
    ============================================================ */
    async function loadAllData() {
      await Promise.all([loadReviews(), loadChats(), loadPosts()]);
      renderSidebarList();
      updateStats();
    }

    async function loadReviews() {
      try {
        const snap = await db.collection('reviews').orderBy('timestamp', 'desc').get();
        allReviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) { console.error('Reviews:', e); allReviews = []; }
    }

    async function loadChats() {
      try {
        const snap = await db.collection('chats').orderBy('lastMessageTime', 'desc').get();
        allChats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) { console.error('Chats:', e); allChats = []; }
    }

    async function loadPosts() {
      try {
        const snap = await db.collection('posts').get();
        allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        allPosts.sort((a, b) => {
          const at = a.createdAt?.toDate?.()?.getTime() || 0;
          const bt = b.createdAt?.toDate?.()?.getTime() || 0;
          return bt - at;
        });
      } catch (e) { console.error('Posts:', e); allPosts = []; }
    }

    function updateStats() {
      document.getElementById('statReviews').textContent = allReviews.length;
      document.getElementById('statChats').textContent = allChats.length;
      document.getElementById('statPosts').textContent = allPosts.filter(p => p.published).length;
      document.getElementById('statDrafts').textContent = allPosts.filter(p => !p.published).length;
    }

    /* ============================================================
       TABS
    ============================================================ */
    window.switchTab = function (tab) {
      currentTab = tab;
      currentFilter = 'all';
      searchTerm = '';
      document.getElementById('searchInput').value = '';

      ['reviews', 'chats', 'blog'].forEach(t => {
        document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
        document.getElementById(t + 'Filter').style.display = t === tab ? 'flex' : 'none';
      });

      document.querySelectorAll('#' + tab + 'Filter .filter-btn').forEach((b, i) => {
        b.classList.toggle('active', i === 0);
      });

      document.getElementById('newPostBtn').style.display = tab === 'blog' ? 'inline-flex' : 'none';

      currentReviewId = null;
      currentChatId = null;
      currentPostId = null;
      document.getElementById('dynamicContent').style.display = 'none';
      document.getElementById('welcomeScreen').style.display = 'flex';
      document.getElementById('chatInputArea').style.display = 'none';
      document.getElementById('headerInfo').innerHTML = '<h2>Welcome, Admin</h2><p>Select an item from the sidebar to manage</p>';

      renderSidebarList();
    };

    window.filterReviews = function (f) {
      currentFilter = f;
      document.querySelectorAll('#reviewsFilter .filter-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(f)));
      renderSidebarList();
    };
    window.filterChats = function (f) {
      currentFilter = f;
      document.querySelectorAll('#chatsFilter .filter-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(f)));
      renderSidebarList();
    };
    window.filterPosts = function (f) {
      currentFilter = f;
      document.querySelectorAll('#blogFilter .filter-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(f)));
      renderSidebarList();
    };

    /* ============================================================
       SIDEBAR
    ============================================================ */
    function renderSidebarList() {
      const el = document.getElementById('itemsList');
      if (currentTab === 'reviews') return renderReviewsList(el);
      if (currentTab === 'chats') return renderChatsList(el);
      if (currentTab === 'blog') return renderPostsList(el);
    }

    function renderReviewsList(el) {
      let list = [...allReviews];
      if (currentFilter === 'pending') list = list.filter(r => !r.approved);
      if (currentFilter === 'approved') list = list.filter(r => r.approved);
      if (searchTerm) {
        list = list.filter(r =>
          r.name?.toLowerCase().includes(searchTerm) ||
          r.email?.toLowerCase().includes(searchTerm) ||
          r.message?.toLowerCase().includes(searchTerm)
        );
      }
      if (!list.length) {
        el.innerHTML = `<div class="empty-msg"><i class="fas fa-inbox"></i><p>No reviews found</p></div>`;
        return;
      }
      el.innerHTML = list.map(r => {
        const isPending = !r.approved;
        const stars = '★'.repeat(r.rating || 0) + '☆'.repeat(5 - (r.rating || 0));
        const date = r.timestamp?.toDate ? new Date(r.timestamp.toDate()).toLocaleDateString() : (r.date || 'Recently');
        return `
          <div class="item-card ${isPending ? 'pending' : ''} ${currentReviewId === r.id ? 'active' : ''}" onclick="selectReview('${r.id}')">
            <div class="item-header">
              <span class="item-title">${esc(r.name || 'Anonymous')}</span>
              ${isPending ? '<span class="item-badge">Pending</span>' : '<span class="item-badge approved">Approved</span>'}
            </div>
            <div class="item-rating">${stars}</div>
            <div class="item-preview">${esc((r.message || '').substring(0, 80))}${(r.message || '').length > 80 ? '...' : ''}</div>
            <div class="item-meta">
              <span><i class="far fa-calendar"></i> ${date}</span>
              <span><i class="fas fa-star"></i> ${r.rating || 0}/5</span>
            </div>
          </div>`;
      }).join('');
    }

    function renderChatsList(el) {
      let list = [...allChats];
      if (currentFilter === 'unread') list = list.filter(c => c.unreadCount > 0);
      if (currentFilter === 'replied') list = list.filter(c => c.status === 'replied');
      if (searchTerm) {
        list = list.filter(c =>
          c.clientName?.toLowerCase().includes(searchTerm) ||
          c.clientEmail?.toLowerCase().includes(searchTerm) ||
          c.subject?.toLowerCase().includes(searchTerm)
        );
      }
      if (!list.length) {
        el.innerHTML = `<div class="empty-msg"><i class="fas fa-inbox"></i><p>No chats found</p></div>`;
        return;
      }
      el.innerHTML = list.map(c => {
        const isUnread = c.unreadCount > 0;
        const t = c.lastMessageTime?.toDate?.() || new Date();
        return `
          <div class="item-card ${isUnread ? 'unread' : ''} ${currentChatId === c.id ? 'active' : ''}" onclick="selectChat('${c.id}')">
            <div class="item-header">
              <span class="item-title">${esc(c.clientName || 'Client')}</span>
              ${isUnread ? `<span class="item-badge unread">${c.unreadCount}</span>` : ''}
            </div>
            <div class="item-preview" style="color:var(--secondary);">📌 ${esc(c.subject || 'General Inquiry')}</div>
            <div class="item-preview">💬 ${esc((c.lastMessage || 'No messages yet').substring(0, 60))}</div>
            <div class="item-meta">
              <span><i class="far fa-clock"></i> ${timeAgo(t)}</span>
              <span><i class="fas fa-comment"></i> ${c.unreadCount || 0} unread</span>
            </div>
          </div>`;
      }).join('');
    }

    function renderPostsList(el) {
      let list = [...allPosts];
      if (currentFilter === 'published') list = list.filter(p => p.published);
      if (currentFilter === 'draft') list = list.filter(p => !p.published);
      if (searchTerm) {
        list = list.filter(p =>
          p.title?.toLowerCase().includes(searchTerm) ||
          p.content?.toLowerCase().includes(searchTerm) ||
          (p.tags || []).join(' ').toLowerCase().includes(searchTerm)
        );
      }
      if (!list.length) {
        el.innerHTML = `<div class="empty-msg"><i class="fas fa-newspaper"></i><p>No posts yet.<br>Click "New Post" to start writing.</p></div>`;
        return;
      }
      el.innerHTML = list.map(p => {
        const isDraft = !p.published;
        const date = p.createdAt?.toDate ? new Date(p.createdAt.toDate()).toLocaleDateString() : 'Draft';
        const tags = (p.tags || []).slice(0, 3).map(t => `<span class="service-tag">${esc(t)}</span>`).join('');
        return `
          <div class="item-card ${isDraft ? 'draft' : ''} ${currentPostId === p.id ? 'active' : ''}" onclick="selectPost('${p.id}')">
            <div class="item-header">
              <span class="item-title">${esc(p.title || 'Untitled')}</span>
              ${isDraft ? '<span class="item-badge draft-badge">Draft</span>' : '<span class="item-badge published">Live</span>'}
            </div>
            <div class="item-preview">${esc((p.excerpt || p.content || '').substring(0, 70))}...</div>
            <div class="item-meta">
              <span><i class="far fa-calendar"></i> ${date}</span>
              <span><i class="fas fa-heart" style="color:#ff4d6d;"></i> <span data-likes="${p.id}">·</span></span>
            </div>
            ${tags ? `<div class="item-tags">${tags}</div>` : ''}
          </div>`;
      }).join('');

      // Fetch real like counts
      list.forEach(async p => {
        try {
          const snap = await db.collection('posts').doc(p.id).collection('likes').get();
          const el2 = document.querySelector(`[data-likes="${p.id}"]`);
          if (el2) el2.textContent = snap.size;
        } catch (e) { /* ignore */ }
      });
    }

    /* ============================================================
       SELECT REVIEW
    ============================================================ */
    window.selectReview = function (id) {
      currentReviewId = id;
      currentChatId = null;
      currentPostId = null;
      document.getElementById('chatInputArea').style.display = 'none';

      const r = allReviews.find(x => x.id === id);
      if (!r) return;

      renderSidebarList();

      document.getElementById('headerInfo').innerHTML = `
        <h2>Review by ${esc(r.name || 'Anonymous')}</h2>
        <p>${esc(r.email || 'No email')} • Submitted: ${esc(r.date || 'Recently')}</p>`;

      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('dynamicContent').style.display = 'block';
      document.getElementById('dynamicContent').innerHTML = `
        <div class="review-detail">
          <div class="detail-message">${esc(r.message || '')}</div>
          ${(r.services || []).length ? `<div class="detail-services">
            ${r.services.map(s => `<span class="detail-service">${esc(s)}</span>`).join('')}
          </div>` : ''}
          <div class="detail-meta">
            <span><i class="far fa-calendar-alt"></i> ${esc(r.date || 'Recently')}</span>
            <span><i class="fas fa-star"></i> ${r.rating || 0}/5</span>
          </div>
          <div class="action-buttons">
            ${!r.approved
              ? `<button class="btn btn-primary" onclick="approveReview('${r.id}')"><i class="fas fa-check"></i> Approve</button>`
              : `<button class="btn btn-warning" onclick="unapproveReview('${r.id}')"><i class="fas fa-undo"></i> Unapprove</button>`}
            <button class="btn btn-danger" onclick="deleteReview('${r.id}')"><i class="fas fa-trash"></i> Delete</button>
          </div>
        </div>`;
    };

    window.approveReview = async function (id) {
      await db.collection('reviews').doc(id).update({ approved: true });
      await loadReviews(); selectReview(id); updateStats();
    };
    window.unapproveReview = async function (id) {
      await db.collection('reviews').doc(id).update({ approved: false });
      await loadReviews(); selectReview(id); updateStats();
    };
    window.deleteReview = async function (id) {
      if (!confirm('Delete this review permanently?')) return;
      await db.collection('reviews').doc(id).delete();
      await loadReviews();
      currentReviewId = null;
      document.getElementById('dynamicContent').style.display = 'none';
      document.getElementById('welcomeScreen').style.display = 'flex';
      renderSidebarList(); updateStats();
    };

    /* ============================================================
       SELECT CHAT
    ============================================================ */
    window.selectChat = async function (id) {
      currentChatId = id;
      currentReviewId = null;
      currentPostId = null;
      document.getElementById('chatInputArea').style.display = 'block';

      const c = allChats.find(x => x.id === id);
      if (!c) return;

      renderSidebarList();

      document.getElementById('headerInfo').innerHTML = `
        <h2>Chat with ${esc(c.clientName || 'Client')}</h2>
        <p>${esc(c.clientEmail || 'No email')} • Subject: ${esc(c.subject || 'General')}</p>`;

      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('dynamicContent').style.display = 'block';
      document.getElementById('dynamicContent').innerHTML = `
        <div class="chat-detail">
          <div class="messages-container" id="messagesContainer">
            <div class="loading-spinner"><div class="spinner"></div><p>Loading messages...</p></div>
          </div>
        </div>`;

      await loadChatMessages(id);
      markChatAsRead(id);
    };

    async function loadChatMessages(chatId) {
      try {
        const snap = await db.collection('chats').doc(chatId).collection('messages')
          .orderBy('timestamp', 'asc').get();

        currentMessages = [];
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';

        if (snap.empty) {
          container.innerHTML = '<div class="empty-msg"><p>No messages yet.</p></div>';
        } else {
          snap.forEach(doc => {
            const m = { id: doc.id, ...doc.data() };
            currentMessages.push(m);
            container.appendChild(renderMessage(m));
          });
          container.scrollTop = container.scrollHeight;
        }

        if (messageListener) messageListener();
        messageListener = db.collection('chats').doc(chatId).collection('messages')
          .orderBy('timestamp', 'asc').onSnapshot(s => {
            s.docChanges().forEach(ch => {
              if (ch.type === 'added') {
                const m = { id: ch.doc.id, ...ch.doc.data() };
                if (!currentMessages.some(x => x.id === ch.doc.id)) {
                  currentMessages.push(m);
                  container.appendChild(renderMessage(m));
                  container.scrollTop = container.scrollHeight;
                }
              }
            });
          });
      } catch (e) { console.error(e); }
    }

    function renderMessage(m) {
      const div = document.createElement('div');
      div.className = 'message ' + (m.sender === 'client' ? 'client' : 'admin');
      const t = m.timestamp?.toDate?.() || new Date();
      const tStr = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `
        <div class="message-content">${esc(m.content)}</div>
        <div class="message-meta">
          <span>${m.sender === 'client' ? 'Client' : 'You'}</span>
          <span>${tStr}</span>
        </div>`;
      return div;
    }

    document.getElementById('adminMessageForm').addEventListener('submit', async e => {
      e.preventDefault();
      const input = document.getElementById('adminMessageInput');
      const content = input.value.trim();
      const btn = document.getElementById('sendMessageBtn');
      if (!content || !currentChatId || !currentAdmin) return;
      try {
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        await db.collection('chats').doc(currentChatId).collection('messages').add({
          sender: 'admin',
          senderEmail: currentAdmin.email,
          content,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          read: false,
          messageType: 'text'
        });
        await db.collection('chats').doc(currentChatId).update({
          lastMessage: content,
          lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
          unreadCount: firebase.firestore.FieldValue.increment(1),
          status: 'replied',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
        input.style.height = 'auto';
      } catch (e) {
        alert('Failed to send message');
      } finally {
        btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
        btn.disabled = false;
      }
    });

    async function markChatAsRead(id) {
      try {
        await db.collection('chats').doc(id).update({ unreadCount: 0 });
        await loadChats();
        renderSidebarList(); updateStats();
      } catch (e) { console.error(e); }
    }

    /* ============================================================
       BLOG
    ============================================================ */
    window.newPost = function () {
      currentPostId = null;
      renderSidebarList();
      showEditor(null);
    };

    window.selectPost = function (id) {
      currentPostId = id;
      renderSidebarList();
      const p = allPosts.find(x => x.id === id);
      showEditor(p);
    };

    function showEditor(post) {
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('chatInputArea').style.display = 'none';
      const wrap = document.getElementById('dynamicContent');
      wrap.style.display = 'block';

      document.getElementById('headerInfo').innerHTML = post
        ? `<h2>Editing: ${esc(post.title || 'Untitled')}</h2><p>${post.published ? 'Published' : 'Draft'} • Last saved: ${post.updatedAt?.toDate?.().toLocaleString() || '—'}</p>`
        : `<h2>New Blog Post</h2><p>Write your article below. Supports Markdown-style formatting.</p>`;

      wrap.innerHTML = `
        <div class="blog-editor">
          <div class="editor-grid">
            <div class="editor-main">
              <div class="field">
                <label>Title *</label>
                <input type="text" id="postTitle" placeholder="e.g. 5 Web Design Trends to Watch in 2026" value="${post ? esc(post.title || '') : ''}">
              </div>
              <div class="field">
                <label>Excerpt (short summary for the blog card)</label>
                <textarea id="postExcerpt" rows="2" placeholder="A one or two sentence summary...">${post ? esc(post.excerpt || '') : ''}</textarea>
              </div>
              <div class="field">
                <label>Content * — Markdown supported</label>
                <textarea id="postContent" placeholder="# Heading&#10;&#10;Write your paragraphs here.&#10;&#10;## Sub-heading&#10;&#10;- Bullet point&#10;- Another point&#10;&#10;**Bold**, *italic*, \`code\`, [link](https://example.com)&#10;&#10;> A quote">${post ? esc(post.content || '') : ''}</textarea>
                <div class="hint">Use <code>#</code> for headings, <code>-</code> for bullets, <code>**bold**</code>, <code>*italic*</code>, <code>&gt;</code> for quotes.</div>
              </div>
            </div>
            <div class="editor-side">
              <div class="toggle-row">
                <span>Published (visible on blog)</span>
                <label class="switch">
                  <input type="checkbox" id="postPublished" ${post && post.published ? 'checked' : ''}>
                  <span class="slider"></span>
                </label>
              </div>
              <div class="field">
                <label>Cover Image URL</label>
                <input type="text" id="postCover" placeholder="https://..." value="${post ? esc(post.coverImage || '') : ''}" oninput="previewCover()">
                <img id="coverPreview" class="cover-preview" alt="">
              </div>
              <div class="field">
                <label>Tags (comma separated)</label>
                <input type="text" id="postTags" placeholder="Web Design, SEO, Tips" value="${post ? esc((post.tags || []).join(', ')) : ''}">
              </div>
              <div class="field">
                <label>Author Name</label>
                <input type="text" id="postAuthor" placeholder="Kreation Digital Hub" value="${post ? esc(post.authorName || '') : ''}">
              </div>
              <div class="editor-actions">
                <button class="btn btn-primary" onclick="savePost()">
                  <i class="fas fa-save"></i> ${post ? 'Save Changes' : 'Create Post'}
                </button>
                <button class="btn btn-info" onclick="previewPost()">
                  <i class="fas fa-eye"></i> Preview
                </button>
                ${post ? `<button class="btn btn-danger" onclick="deletePost('${post.id}')"><i class="fas fa-trash"></i> Delete</button>` : ''}
              </div>
            </div>
          </div>

          ${post ? `
            <div class="engagement-panel">
              <div class="engagement-stats">
                <div class="engagement-stat-block">
                  <div class="engagement-stat-label">Total Likes</div>
                  <div class="engagement-stat-value likes" id="postLikeCount">—</div>
                </div>
                <div class="engagement-stat-block">
                  <div class="engagement-stat-label">Comments</div>
                  <div class="engagement-stat-value comments" id="postCommentCount">—</div>
                </div>
              </div>

              <h3 style="font-size:1.05rem; margin-bottom:0.9rem; color:var(--light); display:flex; align-items:center; gap:0.5rem;">
                <i class="fas fa-comments" style="color:var(--secondary);"></i> Reader Comments
              </h3>
              <div id="adminCommentsList" class="comments-admin-list">
                <div style="color:var(--gray); font-size:0.9rem;">Loading comments...</div>
              </div>
            </div>
          ` : ''}
        </div>`;

      previewCover();

      if (post) loadPostEngagement(post.id);
    }

    async function loadPostEngagement(postId) {
      // Likes
      try {
        const likesSnap = await db.collection('posts').doc(postId).collection('likes').get();
        document.getElementById('postLikeCount').textContent = likesSnap.size;
      } catch (e) { document.getElementById('postLikeCount').textContent = '0'; }

      // Comments
      try {
        const cs = await db.collection('posts').doc(postId).collection('comments').get();
        const comments = cs.docs.map(d => ({ id: d.id, ...d.data() }));
        comments.sort((a, b) => {
          const at = a.createdAt?.toDate?.()?.getTime() || 0;
          const bt = b.createdAt?.toDate?.()?.getTime() || 0;
          return bt - at;
        });
        document.getElementById('postCommentCount').textContent = comments.length;
        const list = document.getElementById('adminCommentsList');
        if (!comments.length) {
          list.innerHTML = `<div style="color:var(--gray); font-size:0.9rem;">No comments yet.</div>`;
          return;
        }
        list.innerHTML = comments.map(c => `
          <div class="admin-comment">
            <div class="admin-comment-head">
              <div>
                <span class="admin-comment-name">${esc(c.name || 'Anonymous')}</span>
                <span class="admin-comment-email">${esc(c.email || '')}</span>
              </div>
              <span class="admin-comment-date">${c.createdAt?.toDate?.().toLocaleString() || '—'}</span>
            </div>
            <div class="admin-comment-text">${esc(c.text || '')}</div>
            <button class="btn btn-danger" style="font-size:0.75rem; padding:0.35rem 0.9rem;" onclick="deleteComment('${postId}', '${c.id}')">
              <i class="fas fa-trash"></i> Delete
            </button>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('postCommentCount').textContent = '0';
        document.getElementById('adminCommentsList').innerHTML = `<div style="color:var(--danger); font-size:0.85rem;">Could not load comments: ${esc(e.message)}</div>`;
      }
    }

    window.deleteComment = async function (postId, commentId) {
      if (!confirm('Delete this comment permanently?')) return;
      try {
        await db.collection('posts').doc(postId).collection('comments').doc(commentId).delete();
        showToast('Comment deleted');
        loadPostEngagement(postId);
      } catch (e) {
        alert('Delete failed: ' + e.message);
      }
    };

    window.previewCover = function () {
      const url = document.getElementById('postCover').value.trim();
      const img = document.getElementById('coverPreview');
      if (url) {
        img.src = url;
        img.style.display = 'block';
        img.onerror = () => { img.style.display = 'none'; };
      } else {
        img.style.display = 'none';
      }
    };

    window.savePost = async function () {
      const title = document.getElementById('postTitle').value.trim();
      const excerpt = document.getElementById('postExcerpt').value.trim();
      const content = document.getElementById('postContent').value.trim();
      const coverImage = document.getElementById('postCover').value.trim();
      const tagsRaw = document.getElementById('postTags').value.trim();
      const authorName = document.getElementById('postAuthor').value.trim() || 'Kreation Digital Hub';
      const published = document.getElementById('postPublished').checked;

      if (!title || !content) {
        alert('Title and content are required.');
        return;
      }

      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

      const data = {
        title, excerpt, content, coverImage, tags, authorName, published,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        if (currentPostId) {
          await db.collection('posts').doc(currentPostId).update(data);
        } else {
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          data.likeCount = 0;
          const ref = await db.collection('posts').add(data);
          currentPostId = ref.id;
        }
        await loadPosts();
        updateStats();
        renderSidebarList();
        document.getElementById('headerInfo').innerHTML = `<h2>Editing: ${esc(title)}</h2><p>${published ? 'Published' : 'Draft'} • Just saved</p>`;
        showToast('Post saved successfully!');
        if (currentPostId) loadPostEngagement(currentPostId);
      } catch (e) {
        alert('Save failed: ' + e.message);
      }
    };

    window.deletePost = async function (id) {
      if (!confirm('Delete this post permanently? This cannot be undone.')) return;
      try {
        await db.collection('posts').doc(id).delete();
        await loadPosts();
        updateStats();
        currentPostId = null;
        document.getElementById('dynamicContent').style.display = 'none';
        document.getElementById('welcomeScreen').style.display = 'flex';
        document.getElementById('headerInfo').innerHTML = '<h2>Welcome, Admin</h2><p>Select an item from the sidebar to manage</p>';
        renderSidebarList();
      } catch (e) {
        alert('Delete failed: ' + e.message);
      }
    };

    window.previewPost = function () {
      const title = document.getElementById('postTitle').value.trim() || 'Untitled';
      const content = document.getElementById('postContent').value;
      const cover = document.getElementById('postCover').value.trim();

      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.onclick = e => { if (e.target === modal) modal.remove(); };
      modal.innerHTML = `
        <div class="modal-box">
          <div class="modal-header">
            <h3>Preview</h3>
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
          </div>
          <div class="modal-body">
            <h1 style="font-size:2rem; margin-bottom:1rem;">${esc(title)}</h1>
            ${cover ? `<img src="${esc(cover)}" style="width:100%; border-radius:12px; margin-bottom:1.5rem;" onerror="this.style.display='none'">` : ''}
            <div class="preview-content">${renderMarkdown(content)}</div>
          </div>
        </div>`;
      document.body.appendChild(modal);
    };

    /* ============================================================
       HELPERS
    ============================================================ */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function inlineFmt(t) {
      return t
        .replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1">')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function renderMarkdown(text) {
      if (!text) return '';
      return String(text).split(/\n{2,}/).map(raw => {
        const b = raw.trim();
        if (!b) return '';
        if (/^###\s+/.test(b)) return `<h3>${inlineFmt(esc(b.replace(/^###\s+/, '')))}</h3>`;
        if (/^##\s+/.test(b)) return `<h2>${inlineFmt(esc(b.replace(/^##\s+/, '')))}</h2>`;
        if (/^#\s+/.test(b)) return `<h2>${inlineFmt(esc(b.replace(/^#\s+/, '')))}</h2>`;
        if (/^>\s?/.test(b)) {
          const q = b.split('\n').map(l => l.replace(/^>\s?/, '')).join('<br>');
          return `<blockquote>${inlineFmt(esc(q))}</blockquote>`;
        }
        if (/^[-*]\s+/.test(b)) {
          const items = b.split('\n').filter(l => /^[-*]\s+/.test(l.trim()))
            .map(l => `<li>${inlineFmt(esc(l.trim().replace(/^[-*]\s+/, '')))}</li>`).join('');
          return `<ul>${items}</ul>`;
        }
        if (/^\d+\.\s+/.test(b)) {
          const items = b.split('\n').filter(l => /^\d+\.\s+/.test(l.trim()))
            .map(l => `<li>${inlineFmt(esc(l.trim().replace(/^\d+\.\s+/, '')))}</li>`).join('');
          return `<ol>${items}</ol>`;
        }
        return `<p>${inlineFmt(esc(b)).replace(/\n/g, '<br>')}</p>`;
      }).join('');
    }

    function timeAgo(date) {
      const diff = Date.now() - date.getTime();
      if (diff < 3600000) return Math.max(1, Math.floor(diff / 60000)) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      return date.toLocaleDateString();
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
        background:linear-gradient(135deg,#39FF14,#00CC99);color:#000;
        padding:0.9rem 2rem;border-radius:30px;font-weight:600;z-index:9999;
        box-shadow:0 10px 30px rgba(57,255,20,0.4);transition:opacity 0.4s;`;
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 2200);
    }

    /* ============================================================
       SEARCH + TEXTAREA
    ============================================================ */
    document.getElementById('searchInput').addEventListener('input', e => {
      searchTerm = e.target.value.toLowerCase();
      renderSidebarList();
    });

    document.getElementById('adminMessageInput').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });

    document.getElementById('adminMessageInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('adminMessageForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
